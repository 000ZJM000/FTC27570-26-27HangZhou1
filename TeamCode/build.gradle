apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

repositories {
    maven { url = 'https://maven.brott.dev/' }
}

abstract class PackagePedroRoute extends DefaultTask {
    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getRouteFile()

    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getShotModelFile()

    @OutputDirectory
    abstract DirectoryProperty getAssetsDirectory()

    @javax.inject.Inject
    abstract FileSystemOperations getFileSystemOperations()

    @TaskAction
    void packageRoute() {
        def source = routeFile
        def shotModel = shotModelFile
        def assets = assetsDirectory
        fileSystemOperations.sync {
            from(source) {
                into('pedro')
                rename { 'two-group-route.json' }
            }
            from(shotModel) {
                into('biobuzz')
                rename { 'shot_model.json' }
            }
            into(assets)
        }
    }
}

def copyPedroRoute = tasks.register('copyPedroRoute', PackagePedroRoute) {
    routeFile.set(rootProject.layout.projectDirectory.file('PP/吸两组设三组2T-3.json'))
    shotModelFile.set(rootProject.layout.projectDirectory.file('测点/shot_model.json'))
    assetsDirectory.set(layout.buildDirectory.dir('generated/pedroRouteAssets'))
}

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    androidResources {
        noCompress += ['wav', 'mp3', 'ogg']
    }

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets.addGeneratedSourceDirectory(copyPedroRoute) { it.assetsDirectory }
    }
}

dependencies {
    implementation project(':FtcRobotController')
    implementation 'com.pedropathing:revhub:3.0.0'
    implementation('com.acmerobotics.dashboard:dashboard:0.6.0') {
        exclude group: 'org.firstinspires.ftc'
    }
}
